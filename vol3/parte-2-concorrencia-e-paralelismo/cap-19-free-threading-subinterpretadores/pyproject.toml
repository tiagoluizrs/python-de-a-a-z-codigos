[project]
name = "cap-19-free-threading-subinterpretadores"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: free-threading e subinterpretadores"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "uv"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
