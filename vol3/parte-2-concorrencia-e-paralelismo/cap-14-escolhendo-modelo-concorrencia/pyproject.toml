[project]
name = "cap-14-escolhendo-modelo-concorrencia"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: escolher o modelo de concorrência"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "uv"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
