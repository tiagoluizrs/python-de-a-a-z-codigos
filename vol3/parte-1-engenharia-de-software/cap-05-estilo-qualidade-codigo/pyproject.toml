[project]
name = "cap-05-estilo-qualidade-codigo"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: estilo e qualidade de código"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pycodestyle", "pyflakes", "radon", "pylint"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

# Configuração do ruff usada pelos exemplos (o livro explica cada linha)
[tool.ruff]
line-length = 88
target-version = "py315"
extend-exclude = ["exemplos/messy.py", "exercicios", "gabaritos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RET", "C90", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
