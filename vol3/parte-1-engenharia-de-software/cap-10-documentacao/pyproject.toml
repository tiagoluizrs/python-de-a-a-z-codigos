[project]
name = "cap-10-documentacao"
version = "0.1.0"
description = "Projeto-exemplo documentado: pacote shapes, docs com Sphinx e doctests"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "sphinx>=8", "pdoc", "interrogate", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shapes"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --doctest-modules"
testpaths = ["tests", "src"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
fail-under = 90
