[project]
name = "cap-11-empacotamento-pypi"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: empacotamento e publicação"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "uv", "packaging", "twine", "trove-classifiers", "hatchling", "setuptools>=77"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
