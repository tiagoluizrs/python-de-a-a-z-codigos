[project]
name = "cap-12-datas-e-tempo"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: cap-12-datas-e-tempo"
requires-python = ">=3.15"
dependencies = ["tzdata", "python-dateutil"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
