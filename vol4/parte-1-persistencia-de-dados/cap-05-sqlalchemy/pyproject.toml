[project]
name = "cap-05-sqlalchemy"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: SQLAlchemy 2"
requires-python = ">=3.15"
dependencies = ["sqlalchemy[asyncio]>=2.1", "aiosqlite", "psycopg[binary]>=3.3", "pymysql", "cryptography", "oracledb>=3", "mssql-python>=1.16"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
