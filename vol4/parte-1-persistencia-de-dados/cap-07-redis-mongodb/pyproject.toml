[project]
name = "cap-07-redis-mongodb"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: Redis e MongoDB"
requires-python = ">=3.15"
dependencies = ["redis>=7", "pymongo>=4.13", "fakeredis", "mongomock"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
