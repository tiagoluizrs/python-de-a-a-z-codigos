[project]
name = "shop-api"
version = "1.0.0"
description = "Um serviço HTTP pequeno para os exemplos de Docker"
requires-python = ">=3.15"
dependencies = ["pydantic>=2.12", "orjson>=3.11", "redis>=6"]

[project.scripts]
shop-api = "shop_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_api"]
