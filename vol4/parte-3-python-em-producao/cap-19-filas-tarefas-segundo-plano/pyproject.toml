[project]
name = "cap-19-filas-tarefas-segundo-plano"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: filas e tarefas em segundo plano"
requires-python = ">=3.15"
dependencies = ["redis>=6", "celery>=5.5", "dramatiq>=1.17", "huey>=2.5", "rq>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
