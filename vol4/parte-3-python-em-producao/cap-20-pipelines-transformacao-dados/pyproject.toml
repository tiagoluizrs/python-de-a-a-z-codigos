[project]
name = "cap-20-pipelines-transformacao-dados"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: pipelines e transformação de dados"
requires-python = ">=3.15"
dependencies = ["polars", "pandas", "pyarrow", "numpy", "psutil"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
