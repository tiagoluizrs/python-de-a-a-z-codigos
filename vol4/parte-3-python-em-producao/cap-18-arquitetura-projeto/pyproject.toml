[project]
name = "cap-18-arquitetura-projeto"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: arquitetura de projeto"
requires-python = ">=3.15"
dependencies = ["httpx"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
