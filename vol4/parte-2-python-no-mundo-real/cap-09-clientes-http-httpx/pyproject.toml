[project]
name = "cap-09-clientes-http-httpx"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: clientes HTTP com httpx"
requires-python = ">=3.15"
dependencies = ["httpx[http2]>=0.28", "requests", "respx"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
