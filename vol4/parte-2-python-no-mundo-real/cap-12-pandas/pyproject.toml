[project]
name = "cap-12-pandas"
version = "0.1.0"
description = "Exemplos e exercícios do capítulo: Pandas"
requires-python = ">=3.15"
dependencies = ["pandas", "numpy", "matplotlib", "plotly", "pyarrow", "openpyxl"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["exemplos"]
